[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sirenic"
version = "0.1.0"
description = "Python client for the Sirenic API: French and European company data from the official registers, with per-block provenance. Pay with an API key or per call in x402."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sirenic", email = "contact@sirenic.eu" }]
keywords = ["sirenic", "siren", "kyb", "company-data", "france", "europe", "registry", "x402", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
# Per-call x402 payment with your own wallet (official x402 Foundation package). 2.20 is the first
# release whose handle_402_response takes the request URL, which the client passes.
pay = ["x402[requests,evm]>=2.20,<3"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://api.sirenic.eu/en/about?utm_source=forge&utm_campaign=sirenic"
Documentation = "https://api.sirenic.eu/en/api?utm_source=forge&utm_campaign=sirenic"
Repository = "https://github.com/sirenic-eu/sirenic-examples"
Changelog = "https://github.com/sirenic-eu/sirenic-examples/blob/main/sdk/python-sirenic/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sirenic = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
