[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sirenic-agents"
version = "0.3.0"
description = "LangChain and CrewAI tools for Sirenic: French and European company data from the official registers. Pay with an API key (prepaid credits) or per call via x402 (USDC or EURC on Base)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sirenic", email = "contact@sirenic.eu" }]
keywords = ["sirenic", "langchain", "crewai", "agents", "kyb", "company-data", "france", "x402"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sirenic>=0.1,<0.2",
    "requests>=2.31",
]

[project.optional-dependencies]
# Per-call x402 payment (an API key or the quote-only mode work without it).
pay = ["sirenic[pay]>=0.1,<0.2"]
langchain = ["langchain-core>=1,<2"]
crewai = ["crewai>=1.15"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://api.sirenic.eu/en/about?utm_source=forge&utm_campaign=sirenic-agents"
Documentation = "https://api.sirenic.eu/en/connectors?utm_source=forge&utm_campaign=sirenic-agents"
Repository = "https://github.com/sirenic-eu/sirenic-examples"
Changelog = "https://github.com/sirenic-eu/sirenic-examples/blob/main/sdk/python/CHANGELOG.md"

[tool.setuptools]
packages = ["sirenic_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
